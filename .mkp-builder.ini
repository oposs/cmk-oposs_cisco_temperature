[package]
# Package Information
name = oposs_cisco_temperature
title = OPOSS Cisco Temperature & DOM
author = Tobias Oetiker <tobi@oetiker.ch>
description = Enhanced Cisco temperature, DOM and power supply checks.

    Provides improved sensor descriptions (combining entPhysicalDescr and
    entPhysicalName), DOM monitoring for optical transceiver power levels
    in dBm, and power supply monitoring in watts, all with device-provided
    thresholds.

    Watt sensors are assigned to the DOM or the power supply check based on
    the ENTITY-MIB containment tree (entSensorMeasuredEntity /
    entPhysicalClass) rather than on sensor naming.

# CheckMK Compatibility
version.min_required = 2.3.0p1
version.packaged = 2.3.0p34

# Optional
download_url = https://github.com/oposs/cmk-oposs_cisco_temperature
version.usable_until =

# Build Options
validate_python = true
